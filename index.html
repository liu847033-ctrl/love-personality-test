<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恋爱人格测试｜发现你的恋爱原型</title>
  <meta name="description" content="30道深度测试题，发现你的恋爱人格类型" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg1: #fff7fb;
      --bg2: #f5f7ff;
      --pink: #ff6b9d;
      --purple: #7c5cff;
      --purple-deep: #5745d1;
      --text: #1f2133;
      --muted: #6d7288;
      --line: #eeeaf8;
      --card: rgba(255,255,255,0.82);
      --shadow: 0 18px 45px rgba(94, 79, 168, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      background: rgba(255, 107, 157, 0.18);
      top: -80px;
      left: -60px;
    }

    body::after {
      background: rgba(124, 92, 255, 0.18);
      right: -70px;
      bottom: 10%;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 26px 20px 52px;
    }

    .hero {
      text-align: center;
      padding: 40px 0 10px;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ff6b9d 0%, #8f6efb 100%);
      box-shadow: 0 16px 34px rgba(157, 118, 255, 0.28);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .logo {
      font-size: 42px;
      color: white;
      font-weight: 800;
      line-height: 1;
    }

    .hero h1 {
      margin-top: 22px;
      font-size: clamp(30px, 4vw, 50px);
      line-height: 1.2;
      letter-spacing: -0.04em;
      font-weight: 900;
      background: linear-gradient(90deg, #ff4d87 0%, #7a5ef7 50%, #4a8eff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 640px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .pill-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .pill {
      border: 1px solid rgba(124, 92, 255, 0.12);
      background: rgba(255,255,255,0.6);
      color: var(--purple-deep);
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 13px;
    }

    .start-btn, .unlock-btn, .secondary-btn {
      border: none;
      cursor: pointer;
      width: 100%;
      height: 60px;
      border-radius: 18px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn {
      margin-top: 30px;
      background: linear-gradient(135deg, #ff5f8f 0%, #7c5cff 100%);
      box-shadow: 0 18px 30px rgba(124, 92, 255, 0.2);
    }

    .secondary-btn {
      background: linear-gradient(135deg, #ff9ab0 0%, #8a6dff 100%);
      box-shadow: 0 16px 25px rgba(124, 92, 255, 0.16);
    }

    .unlock-btn {
      margin-top: 20px;
      background: #111827;
      box-shadow: 0 18px 26px rgba(17, 24, 39, 0.22);
    }

    .start-btn:hover, .unlock-btn:hover, .secondary-btn:hover {
      transform: translateY(-2px);
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(124, 92, 255, 0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 26px 24px;
      margin-top: 20px;
    }

    .progress-wrap { margin-bottom: 18px; }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .progress {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #f0eef8;
      overflow: hidden;
      border: 1px solid rgba(124, 92, 255, 0.05);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink) 0%, var(--purple) 100%);
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      line-height: 1.5;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }

    .option {
      display: block;
      background: rgba(255,255,255,0.7);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 18px 18px;
      margin-top: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .option:hover {
      transform: translateY(-2px);
      border-color: rgba(124, 92, 255, 0.4);
      box-shadow: 0 12px 24px rgba(124, 92, 255, 0.08);
    }

    .option-label {
      display: inline-block;
      width: 30px;
      color: var(--purple);
      font-weight: 900;
      margin-right: 8px;
    }

    .option-text {
      display: inline;
      line-height: 1.7;
      color: var(--text);
      font-size: 16px;
    }

    .result-header {
      text-align: center;
      padding-top: 6px;
    }

    .result-type {
      font-size: clamp(30px, 4vw, 46px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.2;
      background: linear-gradient(90deg, #ff5c94 0%, #7c5cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .result-sub {
      margin-top: 12px;
      color: var(--muted);
      line-height: 1.9;
      font-size: 16px;
    }

    .tags {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      padding: 9px 14px;
      background: #f3f1ff;
      color: var(--purple);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(124, 92, 255, 0.08);
    }

    .chart-wrap {
      margin-top: 26px;
      background: rgba(247, 246, 255, 0.7);
      border-radius: 22px;
      padding: 12px;
      border: 1px solid rgba(124, 92, 255, 0.08);
    }

    .section {
      margin-top: 28px;
    }

    .section h3 {
      font-size: 23px;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .section ul {
      padding-left: 20px;
    }

    .section li {
      color: #35395d;
      line-height: 1.9;
      margin-bottom: 8px;
    }

    .premium {
      margin-top: 34px;
      background: linear-gradient(135deg, #fff6d9 0%, #ffe4ab 100%);
      border-radius: 22px;
      padding: 24px 20px;
      border: 1px solid rgba(255, 173, 34, 0.2);
    }

    .premium h2 {
      font-size: 24px;
      margin-bottom: 14px;
    }

    .premium ul {
      padding-left: 18px;
    }

    .premium li {
      margin-bottom: 8px;
      line-height: 1.8;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .result-actions .secondary-btn,
    .result-actions .unlock-btn {
      width: 50%;
      height: 52px;
      font-size: 16px;
    }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .container { padding-left: 16px; padding-right: 16px; }
      .card { padding: 22px 18px; }
      .option { padding: 16px 14px; }
      .result-actions { flex-direction: column; }
      .result-actions .secondary-btn, .result-actions .unlock-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="welcomePage">
      <div class="hero">
        <div class="logo-wrap">
          <div class="logo">❤</div>
        </div>
        <h1>发现你的恋爱人格</h1>
        <p>通过30道深度问题，分析你的恋爱模式、依恋倾向与情感需求，看看你在爱情里更偏向哪一种类型。</p>
        <div class="pill-row">
          <span class="pill">恋爱原型</span>
          <span class="pill">依恋模式</span>
          <span class="pill">伴侣偏好</span>
          <span class="pill">情感需求</span>
        </div>
        <button class="start-btn" id="startBtn">开始测试</button>
      </div>
    </div>

    <div id="quizPage" class="hidden">
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-top">
            <span id="progressText">第1题</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
        <div id="questionContainer"></div>
      </div>
    </div>

    <div id="resultPage" class="hidden">
      <div class="card">
        <div class="result-header">
          <div id="resultTitle" class="result-type"></div>
          <div id="resultDesc" class="result-sub"></div>
          <div id="resultTags" class="tags"></div>
        </div>

        <div class="chart-wrap">
          <canvas id="radarChart" height="300"></canvas>
        </div>

        <div id="resultContent"></div>

        <div class="premium">
          <h2>解锁完整版恋爱分析</h2>
          <ul>
            <li>你的依恋模式分析</li>
            <li>潜意识择偶偏好</li>
            <li>最适合你的伴侣画像</li>
            <li>恋爱风险预警</li>
            <li>未来成长路线图</li>
          </ul>
          <div class="result-actions">
            <button class="secondary-btn" id="replayBtn">重新测试</button>
            <button class="unlock-btn" id="shareBtn">复制结果</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const personalityTypes = {
      R: '浪漫型',
      E: '探险型',
      L: '逻辑型',
      A: '执着型',
      G: '关怀型',
      F: '自由型'
    };

    const personalityDescriptions = {
      R: {
        title: '浪漫型恋爱人格',
        desc: '你在恋爱里更看重情绪共鸣和浪漫体验，容易被爱意、细节和心动感打动。你不是只想“在一起”，而是想真切地感受到被珍惜。',
        tags: ['情绪敏感', '浪漫表达', '深情投入'],
        details: [
          '你容易被热烈的表达、强烈的陪伴和浪漫细节打动。',
          '你重视“心动感”和情绪连接，不喜欢淡而无味的相处。',
          '你更需要伴侣能够真诚表达爱意，并且愿意用行动回应你。'
        ]
      },
      E: {
        title: '探险型恋爱人格',
        desc: '你更喜欢新鲜感、变化和成长，恋爱不是一成不变的“稳定”，而是不断发现彼此新鲜的过程。你会被有趣的人、有冲劲的人吸引。',
        tags: ['新鲜感', '冒险精神', '共同成长'],
        details: [
          '你不喜欢太平淡的关系，容易对新鲜刺激和创造力更有兴趣。',
          '你在乎双方是否能一起成长、一起尝试新事物。',
          '你适合和有活力、有想法的人相处，能一起体验人生。'
        ]
      },
      L: {
        title: '逻辑型恋爱人格',
        desc: '你更重视稳定基础、现实条件和长期可能性。你不是不敢爱，而是更愿意在感情里保持理性，直到确认兼容性和未来都成立。',
        tags: ['理性判断', '稳定基础', '长期规划'],
        details: [
          '你会先看这段关系是否有现实基础和长期兼容性。',
          '你更容易在感情中保持观察和判断，不容易被冲动带走。',
          '你需要的是成熟、稳妥、可信的相处方式。'
        ]
      },
      A: {
        title: '执着型恋爱人格',
        desc: '你在感情里更容易认真投入，也更容易对关系有强烈期待。你会重视确认、回应和深度连接，心理上对不确定感更敏感。',
        tags: ['深度投入', '安全敏感', '情感渴望'],
        details: [
          '你在乎的是彼此是否真的在意、是否稳定回应。',
          '你容易把爱看得很深，也会因此对不确定更敏感。',
          '你需要伴侣给你持续的安心和明确的情绪表达。'
        ]
      },
      G: {
        title: '关怀型恋爱人格',
        desc: '你很擅长理解和陪伴，恋爱里更看重稳定支持、温柔和心理上的归属感。你想要的不是轰轰烈烈，而是舒服和被照顾。',
        tags: ['同理心', '温暖陪伴', '稳定关怀'],
        details: [
          '你容易关注对方的感受，也希望对方也愿意照顾你。',
          '你在乎的是稳定、温暖和长期相处的质量。',
          '你适合和成熟、可靠、懂得照顾人的人相处。'
        ]
      },
      F: {
        title: '自由型恋爱人格',
        desc: '你珍惜自己的空间和边界，也希望在关系里保持舒适与尊重。你不是不爱，而是更看重爱中不失去自我。',
        tags: ['独立自主', '边界感', '轻松相处'],
        details: [
          '你重视个人空间，不喜欢压迫式的关系。',
          '你更容易和懂得尊重、不会强求的人相处。',
          '你希望爱里有舒适感、尊重感和自由度。'
        ]
      }
    };

    const questions = [
      { id: 1, question: '当你开始对一个人产生好感时，你通常会：', options: { A: { text: '主动寻找机会接近对方', weight: { R: 2, E: 1 } }, B: { text: '先观察一段时间再决定', weight: { L: 2 } }, C: { text: '等待对方释放明显信号', weight: { A: 2, G: 1 } } } },
      { id: 2, question: '第一次约会结束后，你最在意的是：', options: { A: { text: '是否有继续发展的可能', weight: { L: 2, G: 1 } }, B: { text: '相处时是否舒服自然', weight: { G: 2 } }, C: { text: '是否产生了心动感觉', weight: { R: 2, E: 1 } } } },
      { id: 3, question: '对方回复消息比较慢时：', options: { A: { text: '不太在意，对方可能在忙', weight: { F: 2 } }, B: { text: '会偶尔看看有没有回复', weight: { L: 1, G: 1 } }, C: { text: '容易反复猜测原因', weight: { A: 2 } } } },
      { id: 4, question: '如果喜欢的人突然约你出去：', options: { A: { text: '大概率直接答应', weight: { R: 1, E: 2 } }, B: { text: '看当天安排再决定', weight: { L: 2 } }, C: { text: '会先考虑自己状态', weight: { F: 2 } } } },
      { id: 5, question: '刚进入一段关系时，你更倾向：', options: { A: { text: '尽快建立稳定联系', weight: { G: 2 } }, B: { text: '顺其自然发展', weight: { L: 1, G: 1 } }, C: { text: '保持一定距离感', weight: { F: 2 } } } },
      { id: 6, question: '面对表白时：', options: { A: { text: '更看重未来可能性', weight: { L: 2, G: 1 } }, B: { text: '更看重当下感觉', weight: { R: 2 } }, C: { text: '更看重现实条件', weight: { L: 2, F: 1 } } } },
      { id: 7, question: '你觉得恋爱最重要的是：', options: { A: { text: '安全感', weight: { A: 2 } }, B: { text: '理解与陪伴', weight: { G: 2 } }, C: { text: '激情与吸引力', weight: { R: 2, E: 1 } } } },
      { id: 8, question: '如果发现双方兴趣差异较大：', options: { A: { text: '愿意互相了解', weight: { G: 2 } }, B: { text: '看是否影响相处', weight: { L: 2 } }, C: { text: '会担心未来问题', weight: { A: 1, L: 1 } } } },
      { id: 9, question: '在关系初期：', options: { A: { text: '喜欢频繁互动', weight: { A: 2 } }, B: { text: '保持适度联系', weight: { G: 1, L: 1 } }, C: { text: '不希望太快投入', weight: { F: 2 } } } },
      { id: 10, question: '对于命中注定这种说法：', options: { A: { text: '比较相信', weight: { R: 2 } }, B: { text: '半信半疑', weight: { E: 1, L: 1 } }, C: { text: '更相信经营', weight: { L: 2 } } } },
      { id: 11, question: '伴侣和异性朋友单独吃饭时：', options: { A: { text: '充分信任', weight: { F: 1, L: 1 } }, B: { text: '会关注情况', weight: { G: 1, A: 1 } }, C: { text: '容易介意', weight: { A: 2 } } } },
      { id: 12, question: '对方忘记重要纪念日：', options: { A: { text: '理解并提醒', weight: { L: 1, G: 1 } }, B: { text: '会有些失落', weight: { R: 1, A: 1 } }, C: { text: '会很受伤', weight: { A: 2, R: 1 } } } },
      { id: 13, question: '恋爱中最让你害怕的是：', options: { A: { text: '失去自由', weight: { F: 2 } }, B: { text: '被忽视', weight: { A: 2 } }, C: { text: '被背叛', weight: { G: 1, A: 1 } } } },
      { id: 14, question: '伴侣情绪低落时：', options: { A: { text: '主动陪伴安慰', weight: { G: 2 } }, B: { text: '提供实际建议', weight: { L: 2 } }, C: { text: '给对方独处空间', weight: { F: 2 } } } },
      { id: 15, question: '对方突然变得冷淡：', options: { A: { text: '主动沟通原因', weight: { G: 1, L: 1 } }, B: { text: '先观察变化', weight: { L: 2 } }, C: { text: '会忍不住胡思乱想', weight: { A: 2 } } } },
      { id: 16, question: '当关系进入平淡期时，你通常会：', options: { A: { text: '主动创造新的约会体验', weight: { E: 2, R: 1 } }, B: { text: '接受平淡也是感情的一部分', weight: { G: 2, L: 1 } }, C: { text: '开始怀疑彼此是否还相爱', weight: { A: 2 } } } },
      { id: 17, question: '面对异地恋时，你更可能：', options: { A: { text: '制定明确见面计划', weight: { L: 2, G: 1 } }, B: { text: '经常分享生活保持连接', weight: { A: 2, R: 1 } }, C: { text: '担心关系限制个人生活', weight: { F: 2 } } } },
      { id: 18, question: '你理想中的约会更像：', options: { A: { text: '浪漫精致的特别安排', weight: { R: 2 } }, B: { text: '轻松自然地相处聊天', weight: { G: 2 } }, C: { text: '尝试新鲜有趣的活动', weight: { E: 2 } } } },
      { id: 19, question: '恋爱中发生争吵时，你通常：', options: { A: { text: '希望立刻解决问题', weight: { G: 1, L: 1 } }, B: { text: '先冷静思考再沟通', weight: { L: 2 } }, C: { text: '情绪容易受到影响', weight: { A: 2 } } } },
      { id: 20, question: '如果伴侣想查看你的手机：', options: { A: { text: '觉得没什么问题', weight: { A: 1, G: 1 } }, B: { text: '视情况而定', weight: { L: 2 } }, C: { text: '认为应尊重个人隐私', weight: { F: 2 } } } },
      { id: 21, question: '恋爱中的你更接近：', options: { A: { text: '照顾者', weight: { G: 2 } }, B: { text: '陪伴者', weight: { A: 2 } }, C: { text: '探索者', weight: { E: 2 } } } },
      { id: 22, question: '如果伴侣提出新的生活目标：', options: { A: { text: '积极支持并参与', weight: { G: 1, E: 1 } }, B: { text: '分析可行性再决定', weight: { L: 2 } }, C: { text: '鼓励对方自由尝试', weight: { F: 2 } } } },
      { id: 23, question: '你更容易被哪种人吸引：', options: { A: { text: '温暖可靠的人', weight: { G: 2 } }, B: { text: '有魅力有激情的人', weight: { R: 2 } }, C: { text: '独特有想法的人', weight: { E: 2 } } } },
      { id: 24, question: '收到伴侣准备的惊喜时：', options: { A: { text: '非常感动和开心', weight: { R: 2, A: 1 } }, B: { text: '感谢对方的用心', weight: { G: 2 } }, C: { text: '更关注惊喜背后的意义', weight: { L: 2 } } } },
      { id: 25, question: '你对未来关系的期待是：', options: { A: { text: '稳定长久', weight: { G: 2 } }, B: { text: '持续心动', weight: { R: 2 } }, C: { text: '共同成长', weight: { E: 2 } } } },
      { id: 26, question: '当伴侣需要帮助时：', options: { A: { text: '第一时间提供支持', weight: { G: 2 } }, B: { text: '帮忙分析解决办法', weight: { L: 2 } }, C: { text: '鼓励对方独立解决', weight: { F: 2 } } } },
      { id: 27, question: '恋爱中的你最不能接受：', options: { A: { text: '欺骗和失信', weight: { G: 2, A: 1 } }, B: { text: '冷漠和忽视', weight: { A: 2 } }, C: { text: '束缚和控制', weight: { F: 2 } } } },
      { id: 28, question: '对于公开秀恩爱，你更倾向：', options: { A: { text: '喜欢表达爱意', weight: { R: 2 } }, B: { text: '适度即可', weight: { G: 1, L: 1 } }, C: { text: '更喜欢低调相处', weight: { F: 2 } } } },
      { id: 29, question: '如果关系出现长期问题：', options: { A: { text: '努力修复和坚持', weight: { G: 2 } }, B: { text: '客观分析是否继续', weight: { L: 2 } }, C: { text: '考虑是否有新的可能性', weight: { E: 2, F: 1 } } } },
      { id: 30, question: '你认为爱情最终应该带来：', options: { A: { text: '安全感与归属感', weight: { A: 2, G: 1 } }, B: { text: '幸福与陪伴', weight: { G: 2, R: 1 } }, C: { text: '成长与更广阔的人生体验', weight: { E: 2, F: 1 } } } }
    ];

    const scores = { R: 0, E: 0, L: 0, A: 0, G: 0, F: 0 };
    let currentIndex = 0;

    const welcomePage = document.getElementById('welcomePage');
    const quizPage = document.getElementById('quizPage');
    const resultPage = document.getElementById('resultPage');
    const questionContainer = document.getElementById('questionContainer');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressBar = document.getElementById('progressBar');
    const resultTitle = document.getElementById('resultTitle');
    const resultDesc = document.getElementById('resultDesc');
    const resultTags = document.getElementById('resultTags');
    const resultContent = document.getElementById('resultContent');

    document.getElementById('startBtn').addEventListener('click', () => {
      welcomePage.classList.add('hidden');
      quizPage.classList.remove('hidden');
      renderQuestion();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      currentIndex = 0;
      Object.keys(scores).forEach((k) => scores[k] = 0);
      resultPage.classList.add('hidden');
      quizPage.classList.remove('hidden');
      renderQuestion();
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const finalTrait = getTopTrait();
      const result = personalityDescriptions[finalTrait];
      const text = `我在“恋爱人格测试”里测出：${result.title}。快来测测你是什么恋爱人格？${window.location.href}`;
      try {
        await navigator.clipboard.writeText(text);
        alert('结果已复制到剪贴板');
      } catch (err) {
        alert('复制失败：' + err.message);
      }
    });

    function renderQuestion() {
      const q = questions[currentIndex];
      const percent = Math.round(((currentIndex + 1) / questions.length) * 100);
      progressText.textContent = `第${currentIndex + 1}题`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;

      questionContainer.innerHTML = `
        <div class="question-title">${q.question}</div>
        ${Object.keys(q.options).map((key) => `
          <div class="option" data-key="${key}">
            <span class="option-label">${key}.</span>
            <span class="option-text">${q.options[key].text}</span>
          </div>
        `).join('')}
      `;

      questionContainer.querySelectorAll('.option').forEach((btn) => {
        btn.addEventListener('click', () => {
          const selectedKey = btn.dataset.key;
          const selected = q.options[selectedKey];
          Object.entries(selected.weight).forEach(([type, value]) => {
            scores[type] += value;
          });

          currentIndex++;

          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResult();
          }
        });
      });
    }

    function getTopTrait() {
      return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
    }

    function showResult() {
      quizPage.classList.add('hidden');
      resultPage.classList.remove('hidden');

      const topTrait = getTopTrait();
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const secondTrait = sorted[1][0];
      const result = personalityDescriptions[topTrait];

      resultTitle.textContent = result.title;
      resultDesc.textContent = result.desc;
      resultTags.innerHTML = result.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

      const radarData = {
        labels: ['浪漫型', '探险型', '逻辑型', '执着型', '关怀型', '自由型'],
        datasets: [{
          label: '恋爱人格指数',
          data: [scores.R, scores.E, scores.L, scores.A, scores.G, scores.F],
          backgroundColor: 'rgba(124, 92, 255, 0.25)',
          borderColor: '#7c5cff',
          borderWidth: 2,
          pointBackgroundColor: '#ff6b9d'
        }]
      };

      const radarConfig = {
        type: 'radar',
        data: radarData,
        options: {
          responsive: true,
          scales: {
            r: {
              beginAtZero: true,
              max: Math.max(...Object.values(scores)) + 3,
              ticks: { stepSize: 2 }
            }
          },
          plugins: { legend: { display: false } }
        }
      };

      if (window.myRadarChart) {
        window.myRadarChart.destroy();
      }

      const ctx = document.getElementById('radarChart').getContext('2d');
      window.myRadarChart = new Chart(ctx, radarConfig);

      resultContent.innerHTML = `
        <div class="section">
          <h3>你的恋爱特征</h3>
          <ul>
            ${result.details.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>

        <div class="section">
          <h3>人格组合</h3>
          <ul>
            <li>主人格：${personalityTypes[topTrait]}</li>
            <li>辅人格：${personalityTypes[secondTrait]}</li>
            <li>你的恋爱偏好更接近：${personalityTypes[topTrait]} + ${personalityTypes[secondTrait]}</li>
          </ul>
        </div>

        <div class="section">
          <h3>最适合的伴侣类型</h3>
          <ul>
            <li>能理解你内心节奏的人</li>
            <li>愿意认真沟通且稳定相处的人</li>
            <li>会尊重你的边界与情绪空间的人</li>
          </ul>
        </div>

        <div class="section">
          <h3>恋爱中需要注意</h3>
          <ul>
            <li>不要因为强烈情绪而忽略现实基础</li>
            <li>学会在亲密和独立中保持平衡</li>
            <li>真正重要的不是“被追得很紧”，而是被理解和被尊重</li>
          </ul>
        </div>
      `;
    }
  </script>
</body>
</html>
